schema: umicom.application.v1

application:
  id: org.umicom.studio
  name: Umicom Studio IDE
  short_name: Studio
  version: 0.14.0
  executable: umicom-studio-ide
  aliases: [usi, ustudio]

framework:
  minimum_version: 0.5.0
  compatible_major: 0

frontends:
  - console
  - gtk

capabilities:
  - diagnostics
  - configuration
  - messaging
  - workspace
  - documents
  - build
  - search
  - output
  - problems
  - plugins
  - ai
  - runtime-capabilities
  - security-policy
  - toolchain-discovery
  - repository-scaffolding
  - suite-composition

source_layout:
  product_root: src
  composition_root: src/app
  console_frontend: src/console
  gtk_frontend: src/gtk

migration:
  stage: native-platform-foundation-integrated
  product_source_root: src
  completed_vertical_slice: native-platform-and-repository-foundation
  next_vertical_slice: workbench-and-framework-service-adoption

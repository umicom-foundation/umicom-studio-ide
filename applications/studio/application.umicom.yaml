schema: umicom.application.v1

application:
  id: org.umicom.studio
  name: Umicom Studio IDE
  short_name: Studio
  version: 0.13.0
  executable: umicom-studio-ide
  aliases: [usi, ustudio]

framework:
  minimum_version: 0.4.4
  compatible_major: 0

frontends:
  - console
  - gtk

capabilities:
  - diagnostics
  - configuration
  - messaging
  - workspace
  - documents
  - build
  - search
  - output
  - problems
  - plugins
  - ai

source_layout:
  product_root: src
  composition_root: src/app
  console_frontend: src/console
  gtk_frontend: src/gtk

migration:
  stage: typed-settings-integrated
  product_source_root: src
  completed_vertical_slice: configuration-and-typed-settings
  next_vertical_slice: filesystem-and-file-watching

# =============================================================================
# Umicom Studio IDE documentation validation
#
# Builds native C API documentation with Doxygen. The workflow deliberately
# avoids an unfinished MkDocs/Python deployment path.
#
# Author: Sammy Hegab
# Organisation: Umicom Foundation
# Licence: MIT
# =============================================================================
name: Umicom Studio Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doxygen:
    name: Build Doxygen reference
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Studio and Framework
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build API documentation
        run: doxygen docs/Doxyfile

      - name: Upload generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: umicom-studio-api-docs
          path: build/doxygen/html
          if-no-files-found: error

name: Umicom Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Framework and Studio headless
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Studio and all submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install C23 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev

      - name: Display tool versions
        run: |
          clang --version
          cmake --version
          ninja --version
          git --version

      - name: Verify required source checkouts
        run: |
          git submodule status --recursive
          test -f framework/CMakeLists.txt
          test -f applications/studio/CMakeLists.txt
          test -f applications/studio/cmake/StudioSources.cmake

      - name: Enforce repository cleanliness
        run: |
          if git ls-files deploy install _CPack_Packages | grep -q .; then
            echo "Generated deployment, installation or CPack output is tracked."
            exit 1
          fi
          if git ls-files applications/studio scripts/tools/lang \
             | grep -E '(^|/)[^/]*(_v[0-9]+|\.v[0-9]+)([_.]|$)'; then
            echo "Version-suffixed Studio source names are not permitted."
            exit 1
          fi
          if git -C framework ls-files \
             | grep -E '(^|/)[^/]*(_v[0-9]+|v[0-9]+_)([_.]|$)'; then
            echo "Version-suffixed Framework source names are not permitted."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)docs/batches/|^BATCH_[0-9]+'; then
            echo "Batch delivery documentation must not be committed."
            exit 1
          fi
          if git -C framework ls-files | grep -E '(^|/)docs/batches/'; then
            echo "Framework batch delivery documentation must not be committed."
            exit 1
          fi

          check_public_repository_safety() {
            local repository="$1"
            local label="$2"
            local matches

            matches="$(
              git -C "$repository" ls-files \
                | grep -Ei '(^|/)(\.env($|\.)|\.envrc$|\.npmrc$|\.pypirc$|\.netrc$|credentials\.(json|ya?ml|ini|toml|conf)$|secrets?\.(json|ya?ml|ini|toml|conf|env)$|service[-_]?account[^/]*\.json$|oauth[-_]?client[^/]*\.json$|terraform\.tfvars($|\.)|kubeconfig($|\.)|[^/]+\.(pem|key|p12|pfx|jks|keystore)$|id_(rsa|dsa|ecdsa|ed25519)(\.pub)?$)' \
                | grep -Eiv '(^|/)(examples?|templates?)/|\.(example|sample|template|dist)$' \
                || true
            )"
            if [ -n "$matches" ]; then
              echo "$label contains files whose names indicate credentials or secrets:"
              echo "$matches"
              exit 1
            fi

            matches="$(
              git -C "$repository" ls-files \
                | grep -Ei '(^|/)(private|secrets|local-only|internal-only|scratch|junk-folder)/|(^|/)(tree|links|logs)\.txt$|directory[-_ ]?tree|folder[-_ ]?structure|absolute[-_ ]?paths|workspace[-_ ]?inventory|machine[-_ ]?inventory|environment[-_ ]?report' \
                | grep -Eiv '(^|/)(examples?|templates?)/|\.(example|sample|template|dist)$' \
                || true
            )"
            if [ -n "$matches" ]; then
              echo "$label contains private working material or generated structure reports:"
              echo "$matches"
              exit 1
            fi

            if git -C "$repository" grep -nI -E \
              'AKIA[0-9A-Z]{16}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY-----' \
              -- . ':(exclude)third_party/**'; then
              echo "$label contains text matching a high-confidence secret signature."
              exit 1
            fi

            if git -C "$repository" grep -nI -E \
              '([A-Za-z]:\\Users\\[^\\[:space:]]+|/home/[^/[:space:]]+|/Users/[^/[:space:]]+|/workspace/scratch/[0-9]+)' \
              -- '*.md' '*.txt' '*.json' '*.yaml' '*.yml' \
                 ':(exclude).github/workflows/ci.yml'; then
              echo "$label documentation exposes a user-specific absolute path."
              exit 1
            fi
          }

          check_public_repository_safety . "Studio"
          check_public_repository_safety framework "Framework"

      - name: Configure Framework and Studio headless build
        run: |
          cmake \
            -S . \
            -B build/ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DUMICOM_STUDIO_BUILD_GTK=OFF \
            -DUMICOM_ENABLE_STRICT_WARNINGS=ON

      - name: Compile Framework and Studio
        run: cmake --build build/ci --parallel 2

      - name: Run automated tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Run Framework demonstration
        run: ./build/ci/bin/umicom-framework-demo

      - name: Run Studio console smoke test
        run: ./build/ci/bin/umicom-studio-console

      - name: Run native Studio doctor
        run: ./build/ci/bin/umicom-studio-doctor .

      - name: Run retained diagnostics command
        run: ./build/ci/bin/umicom-studio-diagnostics --min info --limit 20 --demo

      - name: Validate typed Studio settings
        run: ./build/ci/bin/umicom-studio-settings --file config/studio.settings validate

  gtk:
    name: GTK application compile and startup
    needs: headless
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Studio and all submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install GTK4 build and startup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libjson-glib-dev \
            libsoup-3.0-dev \
            libcurl4-openssl-dev \
            xvfb

      - name: Configure GTK application build
        run: |
          cmake \
            -S . \
            -B build/gtk-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DUMICOM_STUDIO_BUILD_GTK=ON \
            -DUMICOM_ENABLE_STRICT_WARNINGS=ON

      - name: Compile Framework and GTK Studio application
        run: cmake --build build/gtk-ci --parallel 2

      - name: Start the real Studio workbench
        run: xvfb-run --auto-servernum timeout 20s ./build/gtk-ci/bin/umicom-studio-ide --smoke-test

  windows-ucrt64:
    name: Windows UCRT64 GTK application
    needs: headless
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out Studio and all submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MSYS2 UCRT64 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Configure the canonical Windows GTK build
        shell: msys2 {0}
        run: cmake --preset windows-ucrt64-debug

      - name: Compile Framework and GTK Studio application
        shell: msys2 {0}
        run: cmake --build --preset windows-ucrt64-debug --parallel 2

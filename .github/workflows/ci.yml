# =============================================================================
# Umicom Studio IDE
# Framework-based headless continuous integration
#
# This workflow validates the reusable Umicom Framework and the new Studio
# composition root without requiring GTK4.
#
# The preserved GTK4 application is tested separately on the Windows developer
# workstation until a dedicated Windows MSYS2 runner workflow is introduced.
#
# Author: Sammy Hegab
# Organisation: Umicom Foundation
# Licence: MIT
# =============================================================================

name: Umicom Studio CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Framework and Studio headless
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Studio and all submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install C23 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev

      - name: Display tool versions
        run: |
          clang --version
          cmake --version
          ninja --version
          git --version

      - name: Verify submodules
        run: |
          git submodule status --recursive
          test -f framework/CMakeLists.txt

      - name: Configure Framework and Studio headless build
        run: |
          cmake \
            -S . \
            -B build/ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DUMICOM_STUDIO_BUILD_LEGACY_GTK=OFF \
            -DUMICOM_ENABLE_STRICT_WARNINGS=ON

      - name: Compile Framework and Studio
        run: |
          cmake --build build/ci --parallel 2

      - name: Run automated tests
        run: |
          ctest \
            --test-dir build/ci \
            --output-on-failure

      - name: Run Framework demonstration
        run: |
          ./build/ci/bin/umicom-framework-demo

      - name: Run Studio console smoke test
        run: |
          ./build/ci/bin/umicom-studio-console